<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASBA Property — Inversión inmobiliaria off-market</title>
<meta name="description" content="Búsqueda y selección de activos inmobiliarios off-market para family offices, fondos e inversores privados en España.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.asbaproperty.es/">
<meta property="og:title" content="ASBA Property — Inversión inmobiliaria off-market">
<meta property="og:description" content="Los mejores activos no se anuncian. Se confían. Búsqueda y selección off-market para inversores cualificados.">
<meta property="og:image" content="https://www.asbaproperty.es/share.jpg">
<meta name="theme-color" content="#2B2118">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F1E7}
a{color:#85612A;text-decoration:none}a:hover{color:#6E4F20}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px;box-sizing:border-box;width:100%}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.label{margin:0;font-size:12px;letter-spacing:4px;text-transform:uppercase;font-weight:500}
.rule{display:block;width:56px;height:1px;background:#85612A;border:0;margin:0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:24px}
.navlinks{display:flex;gap:36px;align-items:center}
.navlinks a{color:#2B2118;font-size:14px;padding:12px 0;background:linear-gradient(#85612A,#85612A) 0 calc(100% - 8px)/0 1px no-repeat;transition:background-size 260ms var(--ease-out),color 200ms ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 30px;font-size:14px;font-weight:500;letter-spacing:1px;box-sizing:border-box;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 220ms ease,color 220ms ease,border-color 220ms ease}
.btn:active{transform:scale(0.97)}
.btn-gold{background:#85612A;color:#FBF8F2;border:1px solid #85612A}
.btn-line{background:transparent;color:#2B2118;border:1px solid #2B2118}
.btn-light{background:transparent;color:#F6F1E7;border:1px solid #C9A45C}
.arrow{display:inline-block;transition:transform 220ms var(--ease-out)}
.photo{overflow:hidden}
.photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 900ms var(--ease-out)}
.hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:80px;align-items:center}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:56px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:0}
.about{display:grid;grid-template-columns:0.8fr 1.2fr;gap:96px;align-items:start}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:start}
.zones{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:12px 28px}
.field{display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#6B5D4F}
.field input,.field select,.field textarea{background:transparent;border:0;border-bottom:1px solid #CBBEA6;color:#2B2118;padding:10px 0 12px;font:16px/1.5 Inter,sans-serif;letter-spacing:0;text-transform:none;border-radius:0;transition:border-color 220ms ease}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:#85612A}
a:focus-visible,button:focus-visible{outline:2px solid #85612A;outline-offset:4px}
@media (hover:hover) and (pointer:fine){
.navlinks a:hover{background-size:100% 1px}
.btn-gold:hover{background:#6E4F20;border-color:#6E4F20;color:#FBF8F2}
.btn-line:hover{background:#2B2118;color:#F6F1E7}
.btn-light:hover{background:#C9A45C;color:#2B2118}
.btn:hover .arrow{transform:translateX(4px)}
.photo:hover img{transform:scale(1.025)}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes unveil{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.st{opacity:0;animation:rise 800ms var(--ease-out) forwards}
.st1{animation-delay:90ms}.st2{animation-delay:180ms}.st3{animation-delay:270ms}.st4{animation-delay:360ms}
.unveil{animation:unveil 1200ms var(--ease-out) both}
@media (max-width:960px){
.hero,.g3,.about,.contact{grid-template-columns:1fr;gap:48px}
.g2b{grid-template-columns:1fr}
.navlinks .hide-m{display:none}
.navlinks{gap:20px}
.h1{font-size:50px !important}
.h2{font-size:40px !important}
.mom{font-size:64px !important}
.lead{font-size:26px !important}
.sec{padding:88px 0 !important}
.wrap{padding:0 24px}
.cell{padding:40px 0 !important;border-left:0 !important}
}
@media (prefers-reduced-motion: reduce){.st,.unveil{animation:none;opacity:1;transform:none}.btn:active{transform:none}.photo img{transition:none}}
</style>
</head>
<body><div style="font-family: Inter, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: #F6F1E7; color: #2B2118; padding: 24px; box-sizing: border-box">
<div><p class="label" style="color: #85612A">ASBA Property</p>
<h1 class="serif" style="font-weight: 400; font-size: 56px; margin: 24px 0">Gracias por su <em style="color: #85612A">confianza</em></h1>
<p style="font-size: 17px; line-height: 1.7; color: #6B5D4F; max-width: 460px; margin: 0 auto 40px">Hemos recibido su mensaje. Le responderemos personalmente a la mayor brevedad.</p>
<a class="btn btn-line" href="/">Volver al inicio</a></div></div></body></html>
